name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: playcode_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/playcode_test

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - uses: erlef/setup-beam@v1
        with:
          version-type: strict
          otp-version: "28.1"
          elixir-version: "1.19.5"

      # The repository is in the key: compiled deps keep absolute paths (bupe reads its
      # templates from __DIR__), so a cache built under the old checkout path broke the
      # EPUB export after the repo was renamed to playcode.
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-${{ github.repository }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ github.repository }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile
        run: mix compile --warnings-as-errors

      # mix_audit has no severity threshold: list every advisory, fail on anything
      # above low (a missing severity counts as above). Runs after Compile so no
      # compiler output lands in the JSON.
      - name: Audit dependencies
        run: |
          mix deps.audit --format json > audit.json || true
          jq -r '.vulnerabilities[] | "\(.advisory.severity)\t\(.dependency.package) \(.dependency.version)\t\(.advisory.url)"' audit.json
          jq -e '[.vulnerabilities[].advisory | select(.severity != "low")] == []' audit.json

      - name: Run tests
        run: mix test

      # The browser half of the static site's search; Node is preinstalled on the runner.
      - name: Run JS tests
        run: node --test test/js/*.test.mjs
