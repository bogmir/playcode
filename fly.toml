# fly.toml app configuration file generated for playcode on 2026-02-13T23:19:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playcode'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

# A safety net. With 372 plays a full Generate once peaked near 2.2 GB and was OOM-killed
# at 2 GB (2026-10-08); since the search index is written shard by shard it peaks near
# 220 MB, and one play's switch near 150 MB (dev corpus, one scheduler).
swap_size_mb = 2048

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = '/app/bin/playcode eval Playcode.Release.migrate'

[env]
  PHX_HOST = 'playcode.fly.dev'
  PHX_SERVER = 'true'
  POOL_SIZE = '10'
  PORT = '8080'
  STATIC_SITE_DIR = '/data/site'
  PDF_CACHE_DIR = '/data/pdf'

# The static site, so it survives a stopped machine and a deploy. One volume, so one
# machine: a second would build and deploy a site of its own.
[mounts]
  source = 'playcode_site'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
