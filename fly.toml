# fly.toml app configuration file generated for playcode on 2026-02-13T23:19:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playcode'
primary_region = 'cdg'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

# With 372 plays the static site outgrows 1 GB: one play's switch peaks near 0.9 GB and a
# full Generate near 2.2 GB (measured 2026-10-08; it was OOM-killed at 2 GB). Swap lets
# those finish, slower, instead of killing the app.
swap_size_mb = 2048

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = '/app/bin/playcode eval Playcode.Release.migrate'

[env]
  PHX_HOST = 'playcode.fly.dev'
  PHX_SERVER = 'true'
  POOL_SIZE = '10'
  PORT = '8080'
  STATIC_SITE_DIR = '/data/site'

# The static site, so it survives a stopped machine and a deploy. One volume, so one
# machine: a second would build and deploy a site of its own.
[mounts]
  source = 'playcode_site'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
